name: ci

on:
  push:
    branches: [main, "feat/**", WAF]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,waf]"
      - run: .venv/bin/ruff check src tests
      # models/*.joblib is gitignored; tests/waf needs one to load, so pull the
      # one already trained and attached to the v1.0-models release instead of
      # retraining in CI.
      - run: |
          mkdir -p models
          curl -fL -o models/model.joblib \
            https://github.com/Abdelkrim7Be/ML_Trained_Firewall_For_Web_Apps/releases/download/v1.0-models/model.joblib
      - run: .venv/bin/pytest tests/waf tests/test_*.py -q
